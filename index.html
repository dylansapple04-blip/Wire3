830023042015":["Wire 3"],"120830023043007":["OCALA FIBER NETWORK"]}};     // per-home rival lookup for door pins

// rival brand colors
const RC = {
  "Quantum Fiber":"#3aa0ff", "Metronet Holdings":"#ff8a3d",
  "Cox Communications":"#ff5151", "OCALA FIBER NETWORK":"#b16cff",
  "CenturyLink":"#13d8c4"
};
const RC_DEFAULT = "#ffd23d";
const GREEN = "#00ff87";

const map = L.map("map",{zoomControl:false,attributionControl:false}).setView([29.187,-82.14],11);
const sat = L.tileLayer("https://api.mapbox.com/styles/v1/mapbox/satellite-streets-v12/tiles/512/{z}/{x}/{y}@2x?access_token="+TOKEN,{maxZoom:20,tileSize:512,zoomOffset:-1});
const dark = L.layerGroup([
  L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_nolabels/{z}/{x}/{y}{r}.png",{maxZoom:20}),
  L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_only_labels/{z}/{x}/{y}{r}.png",{maxZoom:20,opacity:.55})
]);
sat.addTo(map);

const cellLayer = L.layerGroup().addTo(map);
const pinLayer = L.layerGroup().addTo(map);
let MODE = "dom";   // "dom" | "riv"

// header totals
(function(){
  let w=0,m=0; for(const k in FOOT){w+=FOOT[k].w;m+=FOOT[k].m;}
  document.getElementById("s-loc").textContent=w.toLocaleString();
  document.getElementById("s-mono").textContent=m.toLocaleString();
  document.getElementById("s-pct").textContent=(w?Math.round(100*m/w):0)+"%";
})();

function targetRes(z){ return z<=10?6 : z<=12?7 : 8; }

// green -> cyan -> amber -> pink by uncontested share (1..0)
function domColor(s){
  const stops=[[0,"#ff2d78"],[0.34,"#ffb300"],[0.67,"#00e5ff"],[1,"#00ff87"]];
  for(let i=0;i<stops.length-1;i++){
    const [a,ca]=stops[i],[b,cb]=stops[i+1];
    if(s>=a&&s<=b){ return lerp(ca,cb,(s-a)/(b-a)); }
  }
  return "#00ff87";
}
function lerp(c1,c2,t){
  const p=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
  const a=p(c1),b=p(c2);
  const m=a.map((v,i)=>Math.round(v+(b[i]-v)*t));
  return "#"+m.map(v=>v.toString(16).padStart(2,"0")).join("");
}
function topRival(r){
  let best=null,bv=-1; for(const k in r){ if(r[k]>bv){bv=r[k];best=k;} } return best;
}

function draw(){
  cellLayer.clearLayers();
  const res=targetRes(map.getZoom());
  const agg={};
  for(const hx in FOOT){
    const parent = res>=8 ? hx : h3.cellToParent(hx,res);
    const a = agg[parent] || (agg[parent]={w:0,m:0,r:{}});
    const f=FOOT[hx]; a.w+=f.w; a.m+=f.m;
    for(const k in f.r) a.r[k]=(a.r[k]||0)+f.r[k];
  }
  for(const cell in agg){
    const a=agg[cell];
    const share = a.w? a.m/a.w : 0;       // uncontested share
    let ring; try{ ring=h3.cellToBoundary(cell); }catch(e){ continue; }
    let fill, op;
    const deep = map.getZoom()>=15;
    if(MODE==="dom"){ fill=domColor(share); op=(0.18+0.45*(1-share)+0.12*share)*(deep?0.25:1); }
    else{
      if(a.m===a.w){ fill=GREEN; op=0.5; }
      else{ const tr=topRival(a.r); fill=RC[tr]||RC_DEFAULT; op=0.25+0.5*(1-share); }
      if(deep) op*=0.25;
    }
    const poly=L.polygon(ring,{color:fill,weight:1,opacity:.85,fillColor:fill,fillOpacity:op});
    poly.bindPopup(cellPopup(cell,a,share,res));
    poly.addTo(cellLayer);
  }
  // resolution note + legend
  buildLegend();
  setStatus();
}

function cellPopup(cell,a,share,res){
  const pct=Math.round(share*100);
  let rivs="";
  const ents=Object.entries(a.r).sort((x,y)=>y[1]-x[1]);
  if(ents.length){
    rivs='<tr><td colspan="2" style="padding-top:6px;color:var(--dim);font-family:\'Space Mono\',monospace;font-size:9px;text-transform:uppercase;letter-spacing:.08em">Fiber rivals here</td></tr>';
    for(const [b,c] of ents){
      const col=RC[b]||RC_DEFAULT;
      rivs+='<tr class="rivrow"><td><span class="dot" style="background:'+col+'"></span>'+b+'</td><td>'+c+'</td></tr>';
    }
  }
  let btn="";
  if(res>=8){ btn='<button class="doorbtn" onclick="loadDoors(\''+cell+'\',this)">Load doors</button>'; }
  return '<div class="pop"><h3>This area</h3>'+
    '<div class="share" style="color:'+domColor(share)+'">'+pct+'%</div>'+
    '<div class="sl">only Wire 3 · no fiber rival</div>'+
    '<table>'+
    '<tr><td>Wire 3 homes</td><td>'+a.w+'</td></tr>'+
    '<tr><td>Only-us homes</td><td style="color:'+GREEN+'">'+a.m+'</td></tr>'+
    rivs+'</table>'+btn+'</div>';
}

function buildLegend(){
  const L_=document.getElementById("legend");
  if(MODE==="dom"){
    L_.innerHTML='<div class="lt">% only Wire 3</div>'+
      row("#00ff87","100% · only us")+
      row("#00e5ff","~⅔ us")+
      row("#ffb300","~⅓ us")+
      row("#ff2d78","contested");
  }else{
    let h='<div class="lt">Who else has fiber</div>'+row(GREEN,"Only Wire 3");
    for(const b in RC) h+=row(RC[b],b.replace(" Holdings","").replace(" Communications",""));
    L_.innerHTML=h;
  }
}
function row(c,t){ return '<div class="lrow"><span class="sw" style="background:'+c+'"></span>'+t+'</div>'; }

// --- door pins (Regrid via Netlify function), per-home rivals ---
const ENDPOINT="/.netlify/functions/parcels";
const pinCache={};
const RIV_PRIORITY=["Quantum Fiber","Metronet Holdings","Cox Communications","OCALA FIBER NETWORK","CenturyLink"];
function homeColor(others){
  if(!others.length) return GREEN;
  for(const b of RIV_PRIORITY){ if(others.includes(b)) return RC[b]||RC_DEFAULT; }
  return RC_DEFAULT;
}
let loadErr=false, loading=0;
function setStatus(){
  const n=document.getElementById("resnote");
  if(loadErr){ n.textContent="Homes unavailable — check Regrid token"; return; }
  if(loading>0){ n.textContent="Loading homes…"; return; }
  const res=targetRes(map.getZoom());
  n.textContent=(map.getZoom()>=15?"Home view":res===6?"County view":res===7?"District view":"Block view")+
    (map.getZoom()>=15?" ▸ each dot is a home":res>=8?" ▸ zoom in for homes":" ▸ zoom in to sharpen");
}
window.loadDoors=async function(hex,btn){
  if(pinCache[hex]){ return; }
  pinCache[hex]=true;              // reserve so auto-load won't double-fire
  if(btn){ btn.textContent="Loading…"; btn.disabled=true; }
  loading++; setStatus();
  const hexFiber=(COMP.hex_comp[hex]||[]);
  const ring=h3.cellToBoundary(hex,true);
  const geometry={type:"Polygon",coordinates:[ring.concat([ring[0]])]};
  try{
    let r;
    try{ r=await fetch(ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({geojson:geometry,limit:1000})}); }
    catch(netErr){ throw new Error("network: "+(netErr&&netErr.message||netErr)); }
    const raw=await r.text();
    if(!r.ok) throw new Error("HTTP "+r.status+" :: "+raw.slice(0,160));
    let j; try{ j=JSON.parse(raw); }catch(_){ throw new Error("non-JSON :: "+raw.slice(0,160)); }
    const pins=j.pins||[]; pinCache[hex]=pins;
    pins.forEach(p=>{
      let fib=(p.block&&COMP.block_comp[p.block])?COMP.block_comp[p.block]:hexFiber;
      const others=fib.filter(b=>b!=="Wire 3");
      const col=homeColor(others);
      const cmp=others.length
        ? '<div class="cmp"><span class="cmph" style="color:#ff2d78">Fiber rivals ('+others.length+')</span>'+others.map(o=>'<div class="o">'+o+'</div>').join('')+'</div>'
        : '<div class="cmp"><span class="cmph" style="color:'+GREEN+'">Only fiber here ✓</span></div>';
      L.circleMarker([p.lat,p.lng],{radius:6,color:col,weight:1,fillColor:col,fillOpacity:.9})
        .bindPopup('<div class="dpop"><div class="a">'+p.address+'</div>'+
          (p.owner?'<div class="o">'+p.owner+'</div>':'')+(p.use?'<div class="o">'+p.use+'</div>':'')+cmp+'</div>')
        .addTo(pinLayer);
    });
    if(btn) btn.outerHTML='<div style="margin-top:10px;font-family:\'Space Mono\',monospace;font-size:11px;font-weight:700;text-align:center;color:'+GREEN+'">'+pins.length+' doors loaded</div>';
  }catch(e){ pinCache[hex]=null; loadErr=true;
    const msg=String(e&&e.message||e);
    if(btn){ btn.outerHTML='<div style="margin-top:10px;font-family:\'Space Mono\',monospace;font-size:10px;line-height:1.4;color:#ff6b8a;word-break:break-word">'+msg+'</div>'; }
    console.error("loadDoors",msg); }
  loading--; setStatus();
};

// auto-load homes for hexes in view once zoomed in
function autoLoadVisible(){
  if(map.getZoom()<15) return;
  const b=map.getBounds();
  for(const hx in FOOT){
    if(pinCache[hx]) continue;
    let c; try{ c=h3.cellToLatLng(hx); }catch(e){ continue; }
    if(b.contains([c[0],c[1]])) loadDoors(hx,null);
  }
}

// controls
document.getElementById("bm").addEventListener("click",function(){
  if(map.hasLayer(sat)){map.removeLayer(sat);dark.addTo(map);this.textContent="◑ SAT";}
  else{map.removeLayer(dark);sat.addTo(map);this.textContent="◐ DARK";}
});
document.getElementById("mode").addEventListener("click",function(){
  MODE = MODE==="dom"?"riv":"dom";
  this.textContent = MODE==="dom"?"◧ MODE: DOMINANCE":"◨ MODE: RIVALS";
  draw();
});

if(typeof h3==="undefined"){ alert("Map library failed to load — reload."); }
map.on("zoomend moveend", function(){ draw(); autoLoadVisible(); });
draw(); autoLoadVisible();
</script>
