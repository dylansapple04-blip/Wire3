document.getElementById("loc").addEventListener("click",function(){
  this.classList.add("on");this.textContent="◎ LOCATING…";
  map.locate({watch:true,enableHighAccuracy:true,setView:true,maxZoom:17});
});
map.on("locationfound",function(e){
  document.getElementById("loc").textContent="◉ YOU";
  const icon=L.divIcon({className:"",html:'<div class="me"></div>',iconSize:[18,18],iconAnchor:[9,9]});
  if(!meMarker){meMarker=L.marker(e.latlng,{icon:icon,zIndexOffset:1000}).addTo(map);}
  else meMarker.setLatLng(e.latlng);
});
map.on("locationerror",function(){document.getElementById("loc").classList.remove("on");
  document.getElementById("loc").textContent="◎ LOCATE";alert("Location unavailable. Allow location access in Safari settings.");});

// ---- controls ----
document.getElementById("bm").addEventListener("click",function(){
  if(map.hasLayer(sat)){map.removeLayer(sat);dark.addTo(map);this.textContent="◑ SAT";}else{map.removeLayer(dark);sat.addTo(map);this.textContent="◐ DARK";}});
document.getElementById("mode").addEventListener("click",function(){MODE=MODE==="dom"?"riv":"dom";this.textContent=MODE==="dom"?"◧ DOMINANCE":"◨ RIVALS";draw();});
document.getElementById("filt").addEventListener("click",function(){ONLYUS=!ONLYUS;this.classList.toggle("on",ONLYUS);this.textContent=ONLYUS?"◆ ONLY-US":"◇ ALL HOMES";renderPins();});

map.on("popupopen",function(e){
  var node=e.popup._contentNode; if(!node)return;
  var btn=node.querySelector(".doorbtn[data-hex]");
  if(btn && !btn._wired){ btn._wired=true;
    L.DomEvent.on(btn,"click",function(ev){ L.DomEvent.stop(ev); loadDoors(btn.getAttribute("data-hex"),btn); });
    L.DomEvent.disableClickPropagation(btn);
  }
});
if(typeof h3==="undefined")alert("Map library failed — reload.");
map.on("zoomend moveend",function(){draw();autoLoadVisible();});
draw();autoLoadVisible();
</script></body></html>
